<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dubai Strike Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #070a10;
      color: #dde5f0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── COLOR BLOBS ── */
    #blobs {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: drift 18s ease-in-out infinite alternate;
    }
    .blob-1 { width: 420px; height: 420px; top: -80px; right: -60px;  background: radial-gradient(circle, rgba(79,158,255,0.18) 0%, transparent 70%); animation-delay: 0s; }
    .blob-2 { width: 300px; height: 300px; top: 40%;  right: 60px;    background: radial-gradient(circle, rgba(248,81,73,0.12) 0%, transparent 70%);  animation-delay: -6s; }
    .blob-3 { width: 360px; height: 360px; bottom: 0; right: 100px;   background: radial-gradient(circle, rgba(163,113,247,0.13) 0%, transparent 70%); animation-delay: -12s; }
    .blob-4 { width: 220px; height: 220px; top: 30%;  right: 240px;   background: radial-gradient(circle, rgba(240,168,32,0.08) 0%, transparent 70%);  animation-delay: -4s; }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-20px, 30px) scale(1.08); }
      100% { transform: translate(15px, -20px) scale(0.95); }
    }

    /* ── MAP ── */
    #map { flex: 1; position: relative; z-index: 1; }

    /* ── SIDEBAR ── */
    #sidebar {
      width: 390px; min-width: 390px;
      position: relative; z-index: 2;
      display: flex; flex-direction: column;
      overflow: hidden;
      /* Glass */
      background: rgba(7, 10, 16, 0.72);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      /* Gradient border via box-shadow + pseudo */
    }
    /* Left gradient border */
    #sidebar::before {
      content: '';
      position: absolute; top: 0; left: 0; bottom: 0; width: 1px;
      background: linear-gradient(180deg,
        rgba(79,158,255,0.5) 0%,
        rgba(163,113,247,0.3) 40%,
        rgba(248,81,73,0.3) 80%,
        rgba(79,158,255,0.2) 100%);
      pointer-events: none; z-index: 10;
    }

    /* ── SECTION DIVIDERS (gradient line) ── */
    .section-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07) 20%, rgba(255,255,255,0.07) 80%, transparent);
      flex-shrink: 0;
    }

    /* ── HEADER ── */
    #header { padding: 14px 18px 10px; flex-shrink: 0; }
    #header-top { display: flex; justify-content: space-between; align-items: flex-start; }
    #header h1 {
      font-size: 14px; font-weight: 700; letter-spacing: 0.4px;
      background: linear-gradient(90deg, #e8eef8, #a8b8d0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #header .subtitle { font-size: 10px; color: #7a8aa0; margin-top: 3px; letter-spacing: 0.2px; }
    #status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 600;
      letter-spacing: 0.3px; cursor: default; flex-shrink: 0;
    }
    .status-clear   { background: rgba(63,185,80,0.12);  color: #4fd060; border: 1px solid rgba(63,185,80,0.25); box-shadow: 0 0 12px rgba(63,185,80,0.08); }
    .status-warning { background: rgba(240,168,32,0.12); color: #f0a820; border: 1px solid rgba(240,168,32,0.25); box-shadow: 0 0 12px rgba(240,168,32,0.08); }
    .status-alert   { background: rgba(248,81,73,0.12);  color: #ff5f57; border: 1px solid rgba(248,81,73,0.25); box-shadow: 0 0 14px rgba(248,81,73,0.15); }

    /* Share button */
    #share-btn {
      display: flex; align-items: center; gap: 7px;
      width: 100%; margin-top: 10px;
      padding: 7px 14px; border-radius: 10px;
      background: rgba(79,158,255,0.08);
      border: 1px solid rgba(79,158,255,0.2);
      color: #7eb8ff; font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all 0.18s; justify-content: center;
      letter-spacing: 0.2px;
    }
    #share-btn:hover { background: rgba(79,158,255,0.15); border-color: rgba(79,158,255,0.4); box-shadow: 0 0 16px rgba(79,158,255,0.12); }
    #share-btn svg { width: 14px; height: 14px; }

    /* Share panel */
    #share-panel {
      padding: 0 18px 12px;
      flex-shrink: 0;
    }
    #share-panel-inner {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(79,158,255,0.15);
      border-radius: 12px; padding: 10px 12px; position: relative;
    }
    #share-label { font-size: 10px; color: #6a8aaa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
    #share-options { display: flex; flex-direction: column; gap: 5px; }
    .share-opt {
      display: flex; flex-direction: column; align-items: flex-start;
      padding: 8px 10px; border-radius: 8px; cursor: pointer; font-family: inherit;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      transition: all 0.15s; text-align: left;
    }
    .share-opt:hover { background: rgba(79,158,255,0.08); border-color: rgba(79,158,255,0.25); }
    .share-opt span { font-size: 12px; font-weight: 500; color: #c8d4e4; }
    .share-opt small { font-size: 10px; color: #5a7a9a; margin-top: 2px; }
    #share-copied { display: none; font-size: 11px; color: #4fd060; margin-top: 8px; }
    #share-close {
      position: absolute; top: 8px; right: 8px;
      background: transparent; border: none; color: #6a8aaa; cursor: pointer;
      font-size: 12px; line-height: 1; padding: 2px 5px; font-family: inherit;
    }
    #share-close:hover { color: #8899b0; }

    /* ── TIMELINE SLIDER ── */
    #timeline-section {
      padding: 12px 18px 10px;
      flex-shrink: 0;
    }
    #timeline-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    #timeline-label { font-size: 9px; color: #607a96; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
    #timeline-value {
      font-size: 11px; color: #7eb8ff; font-weight: 600;
      background: rgba(79,158,255,0.1); padding: 1px 7px; border-radius: 8px;
      border: 1px solid rgba(79,158,255,0.2);
    }
    #timeline-slider {
      width: 100%; -webkit-appearance: none; appearance: none;
      height: 4px; border-radius: 4px; outline: none; cursor: pointer;
      background: linear-gradient(90deg, rgba(79,158,255,0.5) var(--pct,0%), rgba(255,255,255,0.08) var(--pct,0%));
    }
    #timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: linear-gradient(135deg, #6ab4ff, #3d7acc);
      cursor: pointer; border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 10px rgba(79,158,255,0.4);
    }
    #timeline-ends { display: flex; justify-content: space-between; margin-top: 4px; }
    #timeline-ends span { font-size: 9px; color: #506070; font-weight: 500; }

    /* ── FILTERS ── */
    #filters {
      padding: 6px 14px 8px;
      display: flex; flex-direction: column; gap: 5px;
      flex-shrink: 0;
    }
    #filters-type, #filters-conf {
      display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
    }
    .filter-btn {
      padding: 3px 8px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: #607a96; font-size: 10px; cursor: pointer;
      transition: all 0.18s ease; font-weight: 500;
    }
    .filter-btn:hover { color: #7eb8ff; border-color: rgba(79,158,255,0.3); background: rgba(79,158,255,0.06); }
    .filter-btn.active {
      color: #7eb8ff; border-color: rgba(79,158,255,0.4);
      background: rgba(79,158,255,0.1);
      box-shadow: 0 0 8px rgba(79,158,255,0.12), inset 0 0 8px rgba(79,158,255,0.04);
    }
    .filter-sep { width: 1px; background: rgba(255,255,255,0.06); margin: 2px 2px; flex-shrink: 0; }
    #footer-left { display: flex; align-items: center; gap: 5px; }
    #tz-toggle {
      -webkit-appearance: none; appearance: none;
      background: transparent; border: none; border-bottom: 1px dashed rgba(255,255,255,0.18);
      color: inherit; font-size: inherit; padding: 0 1px;
      cursor: pointer; font-family: inherit; transition: color 0.15s; white-space: nowrap;
      border-radius: 0;
    }
    #tz-toggle:hover { color: #7eb8ff; border-bottom-color: rgba(79,158,255,0.4); }
    #tz-toggle.active { color: #7eb8ff; }

    /* ── MY LOCATIONS ── */
    #locations-section { flex-shrink: 0; }
    #locations-header {
      padding: 8px 16px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
      color: #607a96; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
      transition: color 0.15s;
    }
    #locations-header:hover { color: #7eb8ff; background: rgba(79,158,255,0.03); }
    #locations-body { padding: 0 12px 10px; display: none; }
    #locations-body.open { display: block; }
    #loc-input-row { display: flex; gap: 6px; margin-bottom: 7px; }
    #loc-autocomplete { position: relative; flex: 1; }
    #loc-input {
      width: 100%;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
      color: #dde5f0; padding: 5px 10px; font-size: 11px; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    #loc-input:focus {
      border-color: rgba(79,158,255,0.5);
      box-shadow: 0 0 0 3px rgba(79,158,255,0.1);
    }
    #loc-add-btn {
      background: rgba(79,158,255,0.12); border: 1px solid rgba(79,158,255,0.3); color: #7eb8ff;
      border-radius: 8px; padding: 4px 12px; font-size: 11px; cursor: pointer; font-family: inherit;
      transition: all 0.15s; font-weight: 500;
    }
    #loc-add-btn:hover { background: rgba(79,158,255,0.2); }
    #loc-add-btn:disabled { opacity: 0.3; cursor: default; }
    #loc-suggestions {
      display: none; position: absolute; top: 100%; left: 0; right: 0;
      background: rgba(10,15,25,0.95); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08); border-top: none;
      border-radius: 0 0 8px 8px; z-index: 1000; max-height: 160px; overflow-y: auto;
    }
    .loc-suggestion {
      padding: 7px 10px; font-size: 11px; cursor: pointer; color: #8899b0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: all 0.1s;
    }
    .loc-suggestion:last-child { border-bottom: none; }
    .loc-suggestion:hover, .loc-suggestion.active { background: rgba(79,158,255,0.08); color: #7eb8ff; }
    #loc-list { display: flex; flex-direction: column; gap: 4px; }
    .loc-item {
      display: flex; align-items: flex-start; gap: 6px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px; padding: 6px 9px;
      transition: border-color 0.15s, background 0.15s;
    }
    .loc-item:hover { background: rgba(79,158,255,0.05); border-color: rgba(79,158,255,0.2); }
    .loc-dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; margin-top: 4px; flex-shrink: 0; box-shadow: 0 0 5px rgba(63,185,80,0.4); }
    .loc-info { flex: 1; min-width: 0; }
    .loc-dist { font-size: 10px; color: #5a7a9a; margin-top: 2px; }
    .loc-remove { color: #4a6a90; font-size: 11px; cursor: pointer; padding: 0 2px; flex-shrink: 0; transition: color 0.1s; }
    .loc-remove:hover { color: #ff5f57; }
    #loc-share-row { margin-top: 7px; display: flex; gap: 7px; align-items: center; }
    #loc-share-btn {
      flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); color: #5a7a9a;
      border-radius: 7px; padding: 4px 0; font-size: 10px; cursor: pointer; font-family: inherit;
      transition: all 0.15s; font-weight: 500;
    }
    #loc-share-btn:hover { border-color: rgba(79,158,255,0.3); color: #7eb8ff; }
    #loc-status { font-size: 10px; color: #3fb950; display: none; }

    /* Location list editing */
    .loc-name-wrap { display: flex; align-items: center; gap: 4px; }
    .loc-edit-btn { color: #4a6a90; font-size: 10px; cursor: pointer; flex-shrink: 0; opacity: 0; transition: all 0.1s; }
    .loc-item:hover .loc-edit-btn { opacity: 1; }
    .loc-edit-btn:hover { color: #7eb8ff; }
    .loc-name-input {
      font-size: 11px; font-weight: 500;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(79,158,255,0.4); border-radius: 4px;
      color: #dde5f0; padding: 2px 6px; width: 100%; outline: none; font-family: inherit;
    }

    /* ── EVENTS LIST ── */
    #events-list { flex: 1; overflow-y: auto; padding: 6px 0; min-height: 0; }

    .event-card {
      margin: 4px 10px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.18s ease;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.055);
      position: relative; overflow: hidden;
    }
    .event-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
      background: var(--card-accent, rgba(255,255,255,0.1));
      border-radius: 10px 0 0 10px;
    }
    .event-card:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.1);
      transform: translateX(2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .event-card[data-type="impact_major"]   { --card-accent: rgba(248,81,73,0.6); }
    .event-card[data-type="interception"]   { --card-accent: rgba(79,158,255,0.6); }
    .event-card[data-type="impact_minor"]   { --card-accent: rgba(240,168,32,0.6); }
    .event-card[data-type="security_alert"] { --card-accent: rgba(163,113,247,0.6); }

    .event-badges { display: flex; gap: 4px; margin-bottom: 5px; align-items: center; flex-wrap: wrap; }
    .badge {
      display: inline-flex; align-items: center;
      padding: 2px 6px; border-radius: 6px; font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px; font-family: inherit;
    }
    .badge-interception   { background: rgba(79,158,255,0.12);  color: #6ab4ff; border: 1px solid rgba(79,158,255,0.2); }
    .badge-impact_minor   { background: rgba(240,168,32,0.12);  color: #f0a820; border: 1px solid rgba(240,168,32,0.2); }
    .badge-impact_major   { background: rgba(248,81,73,0.12);   color: #ff5f57; border: 1px solid rgba(248,81,73,0.2);  box-shadow: 0 0 8px rgba(248,81,73,0.1); }
    .badge-security_alert { background: rgba(163,113,247,0.12); color: #b48aff; border: 1px solid rgba(163,113,247,0.2); }
    .badge-confirmed { background: rgba(63,185,80,0.1);  color: #4fd060; border: 1px solid rgba(63,185,80,0.2); }
    .badge-suspected { background: transparent; color: #607a96; border: 1px dashed rgba(255,255,255,0.1); }

    .event-time { font-size: 11px; color: #5a7a9a; margin-bottom: 4px; font-weight: 500; }
    .event-time .rel { color: #6a80a0; }
    .event-title { font-size: 12px; font-weight: 500; margin-bottom: 3px; line-height: 1.45; color: #d4e0f0; }
    .translate-btn { background: none; border: none; color: #607a96; font-size: 10px; cursor: pointer; padding: 0 0 4px 0; opacity: 0.7; }
    .translate-btn:hover { opacity: 1; color: #a0c0e0; }
    .event-meta  { font-size: 10px; color: #506080; }
    .event-sources { margin-top: 5px; display: flex; gap: 3px; flex-wrap: wrap; }
    .src-tag {
      padding: 1px 6px; border-radius: 4px; font-size: 9px;
      background: rgba(79,158,255,0.07); color: #6a9acc; text-decoration: none;
      border: 1px solid rgba(79,158,255,0.1); transition: all 0.1s;
    }
    .src-tag:hover { background: rgba(79,158,255,0.15); color: #7eb8ff; }

    #empty-state { padding: 40px 18px; text-align: center; color: #5a7a9a; font-size: 12px; }

    /* ── FOOTER ── */
    #footer {
      padding: 8px 16px;
      font-size: 10px; color: #607a96; display: flex; justify-content: space-between;
      flex-shrink: 0;
    }
    #footer-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    #footer a { color: #6a8aaa; text-decoration: none; }
    #footer a:hover { color: #7eb8ff; }

    /* ── MARKERS ── */
    .cm { border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); }
    .cm-interception  { background: radial-gradient(circle, #6ab4ff, #2d6ecc); width: 14px; height: 14px; box-shadow: 0 0 8px rgba(79,158,255,0.5); }
    .cm-impact_minor  { background: radial-gradient(circle, #f0a820, #b07010); width: 12px; height: 12px; box-shadow: 0 0 6px rgba(240,168,32,0.4); }
    .cm-impact_major  { background: radial-gradient(circle, #ff5f57, #c02020); width: 17px; height: 17px; box-shadow: 0 0 14px rgba(248,81,73,0.6), 0 0 4px rgba(248,81,73,0.4); }
    .cm-security_alert{ background: radial-gradient(circle, #b48aff, #6040bb); width: 13px; height: 13px; box-shadow: 0 0 8px rgba(163,113,247,0.4); }
    .cm-suspected { border-style: dashed; opacity: 0.65; }
    .cm-loc { background: radial-gradient(circle, #4fd060, #1a8030); width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.6); box-shadow: 0 0 10px rgba(63,185,80,0.5); }

    /* ── SCROLLBAR ── */
    .badge-approx {
      background: rgba(255,255,255,0.04);
      color: #4a6a8a;
      border: 1px dashed rgba(255,255,255,0.12);
      font-style: italic;
    }
    .event-card-approx {
      opacity: 0.85;
      border-style: dashed;
    }
    .event-card-approx::before { opacity: 0.4; }
    .event-card-approx:hover { opacity: 1; }

    #events-list::-webkit-scrollbar { width: 3px; }
    #events-list::-webkit-scrollbar-track { background: transparent; }
    #events-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }

    /* ── MOBILE ── */
    @media (max-width: 700px) {
      body { display: block; }
      #map { width: 100%; height: 100vh; }
      #blobs { display: none; }

      #sidebar {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: 56px;
        transition: height 0.28s cubic-bezier(.4,0,.2,1);
        border-left: none;
        border-top: none;
        border-radius: 16px 16px 0 0;
        width: 100%; min-width: 0;
        z-index: 500;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
        /* no saturate on mobile — causes warm color cast over map tiles */
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
      }
      #sidebar::before { display: none; }
      /* Top gradient line on mobile sheet */
      #sidebar::after {
        content: '';
        position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(79,158,255,0.5), rgba(163,113,247,0.4), transparent);
        border-radius: 1px;
        pointer-events: none;
      }
      #sidebar.expanded { height: 72vh; }
      #sidebar.expanded #events-list {
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        touch-action: pan-y;
        flex: 1;
        min-height: 0;
      }
      #header { padding: 10px 16px; cursor: pointer; user-select: none; }
      #header h1 { font-size: 13px; }
      #header .subtitle { display: none; }
      #share-btn { padding: 6px 12px; font-size: 11px; }
      #hamburger { display: none; }
    }

    @media (min-width: 701px) {
      #hamburger { display: none; }
      #sheet-handle { display: none; }
    }
  </style>
</head>
<body>
  <div id="blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>
  <div id="map">
    <div id="hamburger" onclick="toggleSheet()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </div>
  </div>
  <div id="sidebar">

    <div id="sheet-handle"></div>

    <div id="header" onclick="if(window.innerWidth<=700) toggleSheet()">
      <div id="header-top">
        <div>
          <h1>🇦🇪 Dubai Strike Monitor</h1>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <script>
  // ─── MAP ───────────────────────────────────────────────────────────────
  // Restore map view from URL if present
  const DEFAULT_LAT = 25.0, DEFAULT_LON = 55.0, DEFAULT_ZOOM = 8;
  const _urlP = new URL(window.location.href).searchParams;
  // Support compressed short URLs (?s=...) and legacy long URLs
  let _parsedShortState = null;
  const _sParam = _urlP.get('s');
  if (_sParam) {
    try { _parsedShortState = JSON.parse(LZString.decompressFromEncodedURIComponent(_sParam)); } catch(e) {}
  }
  const _initLat  = _parsedShortState?.lat ?? parseFloat(_urlP.get('lat'))  || DEFAULT_LAT;
  const _initLon  = _parsedShortState?.lon ?? parseFloat(_urlP.get('lon'))  || DEFAULT_LON;
  const _initZoom = _parsedShortState?.z   ?? parseInt(_urlP.get('z'))       || DEFAULT_ZOOM;
  const map = L.map('map', { zoomControl: false }).setView([_initLat, _initLon], _initZoom);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // ─── CONSTANTS ─────────────────────────────────────────────────────────
  const TYPE_META = {
    interception:   { label: '🛡 Interception',  cls: 'badge-interception',   mc: 'cm-interception'  },
    impact_minor:   { label: '🔸 Debris',         cls: 'badge-impact_minor',   mc: 'cm-impact_minor'  },
    impact_major:   { label: '💥 Major impact',   cls: 'badge-impact_major',   mc: 'cm-impact_major'  },
    security_alert: { label: '🚨 Security alert', cls: 'badge-security_alert', mc: 'cm-security_alert'},
  };

  // Prevent map pan/zoom from swallowing touches inside the sidebar
  document.getElementById('sidebar').addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
  document.getElementById('sidebar').addEventListener('touchmove',  e => e.stopPropagation(), { passive: true });

  // ─── MOBILE BOTTOM SHEET ──────────────────────────────────────────────
  function toggleSheet() {
    if (window.innerWidth > 700) return;
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('expanded');
    // Update hamburger icon
    const expanded = sidebar.classList.contains('expanded');
    document.getElementById('hamburger').innerHTML = expanded
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="#e6edf3" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="#e6edf3" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>`;
    // Disable map interaction when sheet is open (prevents scroll-through)
    if (expanded) {
      map.dragging.disable();
      map.touchZoom.disable();
      map.scrollWheelZoom.disable();
    } else {
      map.dragging.enable();
      map.touchZoom.enable();
      map.scrollWheelZoom.enable();
    }
    setTimeout(() => map.invalidateSize(), 270);
  }

  // ─── TIMEZONE ──────────────────────────────────────────────────────────
  let tzMode = 'local'; // 'local' | 'dubai'

  function localTZOffset() {
    // Returns short name like "GMT+1", "CET", "EST"
    try {
      const s = new Date().toLocaleTimeString('en-US', {
        timeZoneName: 'short',
        timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
      });
      return s.split(' ').pop();
    } catch(e) { return 'local'; }
  }

  function localOffsetMinutes() {
    return -new Date().getTimezoneOffset(); // minutes east of UTC
  }

  function updateTZBtn() {
    const btn = document.getElementById('tz-toggle');
    if (!btn) return;
    // Hide if local time IS Dubai time (UTC+4 = 240 min)
    if (localOffsetMinutes() === 240) { btn.style.display = 'none'; return; }
    btn.style.display = '';
    // Show the OTHER option (what you'd switch to)
    if (tzMode === 'local') {
      btn.textContent = '🕘 Show in Dubai (UTC+4)';
    } else {
      btn.textContent = `🕘 Show in local (${localTZOffset()})`;
    }
    btn.classList.toggle('active', tzMode === 'dubai');
  }

  function toggleTZ() {
    tzMode = tzMode === 'local' ? 'dubai' : 'local';
    savePrefs();
    updateTZBtn();
    document.getElementById('events-list').querySelectorAll('.event-time').forEach(el => {
      const card = el.closest('[data-datetime]');
      if (card) el.innerHTML = `<span class="rel">${relTime(card.dataset.datetime)}</span>`;
    });
  }

  // ─── RELATIVE TIME ──────────────────────────────────────────────────────

  function fmtAbs(then) {
    const tz = tzMode === 'dubai' ? 'Asia/Dubai' : undefined; // undefined = browser local
    const fmt = new Intl.DateTimeFormat('en-GB', {
      weekday: 'short', day: 'numeric', month: 'short',
      hour: '2-digit', minute: '2-digit', hour12: false,
      ...(tz ? { timeZone: tz } : {}),
    });
    const tzLabel = tzMode === 'dubai' ? ' Dubai' : '';
    return fmt.format(then) + tzLabel;
  }

  function relTime(isoStr) {
    if (!isoStr) return '';
    const then = new Date(isoStr);
    const now  = new Date();
    const ms   = now - then;
    const min  = Math.floor(ms / 60000);
    const h    = Math.floor(ms / 3600000);

    // day diff in UTC (timezone-neutral boundary)
    const todayUTC   = new Date(Date.UTC(now.getUTCFullYear(),  now.getUTCMonth(),  now.getUTCDate()));
    const thenDayUTC = new Date(Date.UTC(then.getUTCFullYear(), then.getUTCMonth(), then.getUTCDate()));
    const dayDiff    = Math.round((todayUTC - thenDayUTC) / 86400000);

    const abs = fmtAbs(then);

    if (min < 60)   return `${min}m ago`;
    if (dayDiff === 0) return `${h}h ago · ${abs}`;
    if (dayDiff === 1) return `1 day ago · ${abs}`;
    return `${dayDiff} days ago · ${abs}`;
  }

  // Short version for footer "Updated X ago" — no absolute date
  function relTimeShort(isoStr) {
    if (!isoStr) return '—';
    const then = new Date(isoStr);
    const ms   = Date.now() - then;
    const min  = Math.floor(ms / 60000);
    const h    = Math.floor(ms / 3600000);
    const d    = Math.floor(ms / 86400000);
    if (min < 60) return `${min}m ago`;
    if (h < 24)   return `${h}h ago`;
    return `${d}d ago`;
  }

  // Format for slider display
  function fmtSliderTime(ts) {
    const d = new Date(ts);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const t = d.toISOString().slice(11,16);
    return `${days[d.getUTCDay()]} ${months[d.getUTCMonth()]} ${d.getUTCDate()} · ${t} UTC`;
  }

  // ─── STATE ─────────────────────────────────────────────────────────────
  let allEvents    = [];
  let userLocs     = [];
  let eventMarkers = [];
  let filterType   = 'all';
  let filterShowConfirmed = true;
  let filterShowSuspected = true;
  let sliderMax    = 0;   // total hours from conflict start to now
  let sliderVal    = 0;   // selected hours from conflict start (0 = conflict start, sliderMax = now)
  let conflictStart= 0;   // Unix ms
  let locOpen      = false;

  // ─── HAVERSINE ─────────────────────────────────────────────────────────
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function nearestEvent(lat, lon) {
    let best = null, bestD = Infinity;
    allEvents.forEach(e => {
      if (!e.lat || !e.lon) return;
      const dist = haversine(lat, lon, e.lat, e.lon);
      if (dist < bestD) { bestD = dist; best = e; }
    });
    return best ? { event: best, km: bestD } : null;
  }

  // ─── ICONS ─────────────────────────────────────────────────────────────
  function makeEventIcon(type, confirmed) {
    const meta = TYPE_META[type] || TYPE_META['impact_major'];
    return L.divIcon({
      className: '',
      html: `<div class="cm ${meta.mc}${!confirmed?' cm-suspected':''}"></div>`,
      iconSize: [20, 20], iconAnchor: [10, 10]
    });
  }
  function makeLocIcon() {
    return L.divIcon({
      className: '',
      html: `<div class="cm cm-loc"></div>`,
      iconSize: [20, 20], iconAnchor: [10, 10]
    });
  }

  // ─── POPUP CONTENT ─────────────────────────────────────────────────────
  function popupHTML(e) {
    const tm = TYPE_META[e.type] || {};
    const rel = relTime(e.datetime);
    const srcs = (e.sources||[]).slice(0,2).map(s =>
      `<a href="${s.url}" target="_blank" style="color:#58a6ff">${s.domain}</a>`
    ).join(' · ');
    return `<div style="font-family:system-ui;font-size:12px;max-width:240px;line-height:1.4">
      <div style="font-weight:600;margin-bottom:4px">${e.title}</div>
      <div style="color:#8b949e;font-size:11px;margin-bottom:4px">
        ${rel}${rel ? ' · ' : ''}${e.location}
      </div>
      <div style="font-size:10px">${srcs}</div>
    </div>`;
  }

  // ─── RENDER ────────────────────────────────────────────────────────────
  function getSelectedCutoff() {
    if (windowHours >= sliderMax) return 0; // ALL — no lower bound
    return Date.now() - windowHours * 3600000; // oldest allowed timestamp
  }

  // ─── SPIRAL OFFSET ────────────────────────────────────────────────────
  // For N events sharing exact coords, spread them in a circle so each is clickable
  function spiralOffsets(events) {
    // Group by rounded lat/lon key
    const groups = {};
    events.forEach((e, i) => {
      if (!e.lat || !e.lon) return;
      const key = e.lat.toFixed(4) + ',' + e.lon.toFixed(4);
      if (!groups[key]) groups[key] = [];
      groups[key].push(i);
    });

    const offsets = new Array(events.length).fill(null).map(() => ({ lat: 0, lon: 0 }));
    const R = 0.009; // ~1km offset radius in degrees
    Object.values(groups).forEach(idxs => {
      if (idxs.length <= 1) return;
      idxs.forEach((i, k) => {
        const angle = (k / idxs.length) * 2 * Math.PI - Math.PI / 2;
        offsets[i].lat = R * Math.cos(angle);
        offsets[i].lon = R * Math.sin(angle) / Math.cos((events[i].lat || 25) * Math.PI / 180);
      });
    });
    return offsets;
  }

  function renderEvents() {
    eventMarkers.forEach(m => map.removeLayer(m));
    eventMarkers = [];

    const cutoff = getSelectedCutoff();

    const filtered = allEvents.filter(e => {
      const tOk = filterType === 'all' || e.type === filterType;
      const cOk = (filterShowConfirmed && e.confirmed === true)
        || (filterShowSuspected && e.confirmed === false);
      const dt = e.datetime ? new Date(e.datetime).getTime() : Date.now();
      const timeOk = dt >= cutoff; // show events within window (dt >= oldest allowed)
      const viewOk = eventInViewport(e);
      return tOk && cOk && timeOk && viewOk;
    });

    const list = document.getElementById('events-list');

    const total = allEvents.filter(e => (filterType === 'all' || e.type === filterType) && ((filterShowConfirmed && e.confirmed === true) || (filterShowSuspected && e.confirmed === false))).length;
    const countEl = document.getElementById('events-count');
    if (countEl) countEl.textContent = filtered.length === total
      ? `${filtered.length} event${filtered.length !== 1 ? 's' : ''}`
      : `${filtered.length} / ${total} events in view`;

    if (filtered.length === 0) {
      list.innerHTML = '<div id="empty-state">No events in current view.<br><small style="opacity:.5">Pan or zoom out to see more.</small></div>';
      return;
    }

    // Split: precise (on map) vs imprecise (sidebar only)
    const isPrecise = e => e.lat && e.lon && (!e.precision || e.precision === 'exact');

    list.innerHTML = filtered.map(e => {
      const tm = TYPE_META[e.type] || {};
      const confClass = e.confirmed ? 'badge-confirmed' : 'badge-suspected';
      const confLabel = e.confirmed ? '✅ Confirmed' : '❓ Suspected';
      const srcs = (e.sources||[]).map(s =>
        `<a class="src-tag" href="${s.url}" target="_blank">${s.domain}</a>`
      ).join('');
      const rel = relTime(e.datetime);
      const approxBadge = !isPrecise(e)
        ? `<span class="badge badge-approx">📍 ${e.location || 'Area'}</span>` : '';
      const clickAttr = isPrecise(e)
        ? `onclick="flyTo(${e.lat},${e.lon})"` : '';
      return `<div class="event-card${!isPrecise(e) ? ' event-card-approx' : ''}" data-type="${e.type||''}" data-datetime="${e.datetime||''}" ${clickAttr}>
        <div class="event-badges">
          ${tm.label ? `<span class="badge ${tm.cls}">${tm.label}</span>` : ''}
          <span class="badge ${confClass}">${confLabel}</span>
          ${approxBadge}
        </div>
        ${rel ? `<div class="event-time"><span class="rel">${rel}</span></div>` : ''}
        <div class="event-title" id="title-${e.id}">${needsTranslation(e.title) ? (window._translations[e.id]?.translated || e.title) : e.title}</div>
        ${needsTranslation(e.title) ? `<button class="translate-btn" id="trbtn-${e.id}" onclick="toggleOriginal(event,'${e.id}','${encodeURIComponent(e.title)}')">${window._translations[e.id]?.translated ? '🌐 Original' : ''}</button>` : ''}
        <div class="event-meta">${e.location || 'UAE'}</div>
        ${srcs ? `<div class="event-sources">${srcs}</div>` : ''}
      </div>`;
    }).join('');

    // Map markers — precise only, with spiral offsets for overlaps
    const preciseFiltered = filtered.filter(isPrecise);
    const offsets = spiralOffsets(preciseFiltered);

    preciseFiltered.forEach((e, i) => {
      const lat = e.lat + offsets[i].lat;
      const lon = e.lon + offsets[i].lon;
      const m = L.marker([lat, lon], {
        icon: makeEventIcon(e.type, e.confirmed),
        zIndexOffset: 500,
      })
        .addTo(map)
        .bindPopup(popupHTML(e), { maxWidth: 260 });
      m.on('mouseover click', function() { this.openPopup(); });
      eventMarkers.push(m);
    });
  }

  function flyTo(lat, lon) { map.flyTo([lat, lon], 12, { duration: 0.8 }); }

  // ─── VIEWPORT FILTER ───────────────────────────────────────────────────
  function eventInViewport(e) {
    // No coords or country-level → always show (could be anywhere in the country)
    if (!e.lat || !e.lon) return true;
    if (e.precision === 'country') return true;

    let bounds;
    try { bounds = map.getBounds(); } catch(_) { return true; } // map not ready → show all

    if (!e.precision || e.precision === 'exact') {
      return bounds.contains([e.lat, e.lon]);
    }

    // City / emirate: expand the viewport check by the uncertainty radius
    const radiusKm = e.radius_km
      || (e.precision === 'emirate' ? 80 : 20); // defaults if radius_km absent
    const latDeg = radiusKm / 111;
    const lonDeg = radiusKm / (111 * Math.cos(e.lat * Math.PI / 180));
    const expanded = L.latLngBounds(
      [bounds.getSouth() - latDeg, bounds.getWest() - lonDeg],
      [bounds.getNorth() + latDeg, bounds.getEast() + lonDeg]
    );
    return expanded.contains([e.lat, e.lon]);
  }

  // Re-filter sidebar when the map moves or zooms
  map.on('moveend zoomend', () => { renderEvents(); });

  function updateConfFilters() {
    // Always check the full dataset — pills must not jump based on slider/type filter
    const hasSuspected = allEvents.some(e => e.confirmed === false);
    document.getElementById('filters-conf').style.display = hasSuspected ? 'flex' : 'none';
  }

  function updateStatus(events) { /* badge removed */ }

  // ─── TIMELINE SLIDER ───────────────────────────────────────────────────
  // windowHours = how many hours back from now to show
  // Slider: left=max(ALL), right=1h — we invert the raw slider value
  let windowHours = 0; // 0 = ALL

  function windowLabel(h) {
    if (h === 0 || h >= sliderMax) return 'All';
    if (h >= 48)  return `Last ${Math.round(h/24)}d`;
    if (h >= 24)  return 'Last 24h';
    if (h >= 1)   return `Last ${h}h`;
    return '1h';
  }

  function initSlider(conflictStartISO) {
    conflictStart = new Date(conflictStartISO).getTime();
    const now = Date.now();
    sliderMax = Math.ceil((now - conflictStart) / 3600000);
    windowHours = 0; // default: show all

    const slider = document.getElementById('timeline-slider');
    slider.min = 1;
    slider.max = sliderMax;
    slider.value = 1; // leftmost (min) = ALL

    windowHours = sliderMax; // show all by default

    // Left end label = ALL, right end label = 1h
    document.querySelector('#timeline-ends span:first-child').textContent = 'All';
    document.querySelector('#timeline-ends span:last-child').textContent = '1h';
    document.getElementById('timeline-value').textContent = 'All';

    // Animate slider track fill
    const updateTrack = () => {
      const pct = ((parseInt(slider.value) - 1) / (sliderMax - 1) * 100).toFixed(1);
      slider.style.setProperty('--pct', pct + '%');
    };
    slider.addEventListener('input', () => { updateTrack();
      const raw = parseInt(slider.value);
      // raw=1 (left) → ALL, raw=sliderMax (right) → 1h
      windowHours = sliderMax - raw + 1;
      document.getElementById('timeline-value').textContent = windowLabel(windowHours);
      renderEvents(); renderLocations(); savePrefs();
    });
    updateTrack();
  }

  // ─── FILTERS ───────────────────────────────────────────────────────────
  document.querySelectorAll('[data-type]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); filterType = btn.dataset.type; renderEvents(); savePrefs();
    });
  });
  document.querySelectorAll('[data-conf]').forEach(btn => {
    btn.addEventListener('click', () => {
      const conf = btn.dataset.conf;
      // Toggle independent; prevent both off
      if (conf === 'confirmed') {
        const next = !filterShowConfirmed;
        if (!next && !filterShowSuspected) return; // would hide everything
        filterShowConfirmed = next;
      } else {
        const next = !filterShowSuspected;
        if (!next && !filterShowConfirmed) return;
        filterShowSuspected = next;
      }
      document.querySelector('[data-conf="confirmed"]').classList.toggle('active', filterShowConfirmed);
      document.querySelector('[data-conf="suspected"]').classList.toggle('active', filterShowSuspected);
      renderEvents(); savePrefs();
    });
  });

  // ─── MY LOCATIONS ──────────────────────────────────────────────────────
  function toggleLocations() {
    locOpen = !locOpen;
    document.getElementById('locations-body').classList.toggle('open', locOpen);
    document.getElementById('loc-toggle').textContent = locOpen ? '▲' : '▼';
  }

  // ─── AUTOCOMPLETE ──────────────────────────────────────────────────────
  let acTimer = null;
  let acResults = [];
  let acIndex = -1;

  const locInput = document.getElementById('loc-input');
  const locSugg  = document.getElementById('loc-suggestions');

  function shortName(display_name) {
    return display_name.split(',').slice(0, 3).join(', ').trim();
  }

  function showSuggestions(items) {
    acResults = items;
    acIndex = -1;
    if (!items.length) { locSugg.style.display = 'none'; return; }
    locSugg.innerHTML = items.map((r, i) =>
      `<div class="loc-suggestion" data-i="${i}">${shortName(r.display_name)}</div>`
    ).join('');
    locSugg.style.display = 'block';
    locSugg.querySelectorAll('.loc-suggestion').forEach(el => {
      el.addEventListener('mousedown', e => {
        e.preventDefault();
        selectSuggestion(parseInt(el.dataset.i));
      });
    });
  }

  function hideSuggestions() {
    locSugg.style.display = 'none';
    acIndex = -1;
  }

  function selectSuggestion(i) {
    const r = acResults[i];
    if (!r) return;
    hideSuggestions();
    locInput.value = '';
    if (userLocs.length >= 5) { alert('Max 5 locations'); return; }
    pushLocation({ name: shortName(r.display_name), lat: parseFloat(r.lat), lon: parseFloat(r.lon) });
    syncURL(); saveLocations();
  }

  locInput.addEventListener('input', () => {
    clearTimeout(acTimer);
    const q = locInput.value.trim();
    if (q.length < 2) { hideSuggestions(); return; }
    acTimer = setTimeout(async () => {
      try {
        const r = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&addressdetails=0&viewbox=51.0,26.5,56.5,22.0&bounded=0`,
          { headers: { 'Accept-Language': 'en' } }
        );
        const data = await r.json();
        showSuggestions(data);
      } catch(e) { hideSuggestions(); }
    }, 300);
  });

  locInput.addEventListener('keydown', e => {
    const items = locSugg.querySelectorAll('.loc-suggestion');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      acIndex = Math.min(acIndex + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === acIndex));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      acIndex = Math.max(acIndex - 1, -1);
      items.forEach((el, i) => el.classList.toggle('active', i === acIndex));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (acIndex >= 0) { selectSuggestion(acIndex); }
      else { addLocation(); }
    } else if (e.key === 'Escape') {
      hideSuggestions();
    }
  });

  locInput.addEventListener('blur', () => setTimeout(hideSuggestions, 150));

  async function addLocation() {
    if (userLocs.length >= 5) { alert('Max 5 locations'); return; }
    const name = locInput.value.trim();
    if (!name) return;
    const btn = document.getElementById('loc-add-btn');
    btn.disabled = true; btn.textContent = '…';
    try {
      const r = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name)}&format=json&limit=1&viewbox=51.0,26.5,56.5,22.0&bounded=0`,
        { headers: { 'Accept-Language': 'en' } }
      );
      const data = await r.json();
      if (!data.length) { alert('Location not found'); return; }
      hideSuggestions();
      locInput.value = '';
      pushLocation({ name: shortName(data[0].display_name), lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) });
      syncURL(); saveLocations();
    } catch(e) { alert('Geocoding failed'); }
    finally { btn.disabled = false; btn.textContent = 'Add'; }
  }

  function pushLocation(loc) {
    const label = loc.tag || loc.name;
    const m = L.marker([loc.lat, loc.lon], { icon: makeLocIcon(), zIndexOffset: -2000 })
      .addTo(map).bindPopup(`<b>${label}</b>${loc.name && loc.tag ? `<br><span style="font-size:10px;color:#888">${loc.name}</span>` : ''}`);
    m.on('mouseover click', function() { this.openPopup(); });
    userLocs.push({ ...loc, marker: m });
    renderLocations();
  }

  function removeLocation(i) {
    map.removeLayer(userLocs[i].marker);
    userLocs.splice(i, 1);
    renderLocations(); syncURL(); saveLocations();
  }

  function renderLocations() {
    const cnt = userLocs.length;
    document.getElementById('loc-count').textContent = cnt ? `(${cnt}/5)` : '';
    const list = document.getElementById('loc-list');
    list.innerHTML = userLocs.map((loc, i) => {
      const near = nearestEvent(loc.lat, loc.lon);
      const distStr = near
        ? `${near.km < 1 ? '<1' : near.km.toFixed(0)} km from ${near.event.location}`
        : 'No nearby events';
      const tag  = loc.tag  || '';
      const addr = loc.name || '';
      return `<div class="loc-item">
        <div class="loc-dot"></div>
        <div class="loc-info">
          <div class="loc-name-wrap">
            ${tag ? `<span style="font-size:12px;font-weight:600;color:#e6edf3">${tag}</span>` : ''}
            <span class="loc-edit-btn" title="Edit" onclick="startEditLoc(${i})">✏️</span>
          </div>
          ${addr ? `<div style="font-size:10px;color:#8b949e;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${addr}</div>` : ''}
          <div class="loc-dist">${distStr}</div>
        </div>
        <span class="loc-remove" onclick="removeLocation(${i})">✕</span>
      </div>`;
    }).join('');
  }

  function startEditLoc(i) {
    const list  = document.getElementById('loc-list');
    const items = list.querySelectorAll('.loc-item');
    const info  = items[i].querySelector('.loc-info');
    const loc   = userLocs[i];
    info.innerHTML = `
      <input class="loc-name-input" id="_locTagEdit_${i}" placeholder="Label" value="${(loc.tag||'').replace(/"/g,'&quot;')}" style="margin-bottom:3px" />
      <input class="loc-name-input" id="_locAddrEdit_${i}" placeholder="Address" value="${(loc.name||'').replace(/"/g,'&quot;')}" />`;
    const tagInp  = document.getElementById(`_locTagEdit_${i}`);
    const addrInp = document.getElementById(`_locAddrEdit_${i}`);
    tagInp.focus(); tagInp.select();
    const save = () => {
      const tag  = tagInp.value.trim();
      const addr = addrInp.value.trim();
      if (!userLocs[i]) return;
      userLocs[i].tag  = tag;
      userLocs[i].name = addr;
      const label = tag || addr;
      userLocs[i].marker.setPopupContent(
        `<b>${label}</b>${addr && tag ? `<br><span style="font-size:10px;color:#888">${addr}</span>` : ''}`
      );
      renderLocations(); syncURL(); saveLocations();
    };
    [tagInp, addrInp].forEach(inp => {
      inp.addEventListener('blur', () => setTimeout(save, 100));
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter')  { e.preventDefault(); save(); }
        if (e.key === 'Escape') { renderLocations(); }
      });
    });
  }

  // ─── URL / STORAGE ─────────────────────────────────────────────────────
  const _COORD_TOL = 0.0001;
  function syncURL() {
    const url = new URL(window.location.href);
    url.searchParams.delete('s'); // clear any compressed state
    // Map position — only write if different from defaults (option 3: delta encoding)
    const c = map.getCenter();
    const lat = c.lat, lon = c.lng, z = map.getZoom();
    if (Math.abs(lat - DEFAULT_LAT) > _COORD_TOL) url.searchParams.set('lat', lat.toFixed(4)); else url.searchParams.delete('lat');
    if (Math.abs(lon - DEFAULT_LON) > _COORD_TOL) url.searchParams.set('lon', lon.toFixed(4)); else url.searchParams.delete('lon');
    if (z !== DEFAULT_ZOOM) url.searchParams.set('z', z); else url.searchParams.delete('z');
    // Locations
    if (userLocs.length) {
      url.searchParams.set('locs', userLocs.map(l =>
        `${encodeURIComponent(l.tag||'')}~${encodeURIComponent(l.name||'')}~${l.lat}~${l.lon}`
      ).join('|'));
    } else {
      url.searchParams.delete('locs');
    }
    window.history.replaceState({}, '', url.toString());
  }

  // Build compressed share URL (option 1: lz-string)
  function buildShortUrl(includeLocs) {
    const c = map.getCenter();
    const state = { lat: parseFloat(c.lat.toFixed(4)), lon: parseFloat(c.lng.toFixed(4)), z: map.getZoom() };
    if (includeLocs && userLocs.length) {
      state.locs = userLocs.map(l => ({ tag: l.tag||'', name: l.name||'', lat: parseFloat((+l.lat).toFixed(4)), lon: parseFloat((+l.lon).toFixed(4)) }));
    }
    const u = new URL(window.location.href);
    for (const k of [...u.searchParams.keys()]) u.searchParams.delete(k);
    u.searchParams.set('s', LZString.compressToEncodedURIComponent(JSON.stringify(state)));
    return u.toString();
  }

  // Sync map position to URL on every move
  map.on('moveend', syncURL);

  // ─── ADD LOCATION BY MAP CLICK / LONG PRESS ────────────────────────────
  async function showAddLocPopup(latlng) {
    if (userLocs.length >= 5) {
      L.popup().setLatLng(latlng).setContent('<b>Max 5 locations reached</b>').openOn(map);
      return;
    }
    const popup = L.popup({ closeButton: true, minWidth: 200 })
      .setLatLng(latlng)
      .setContent('<div style="font-size:12px;font-family:system-ui">📍 Looking up address…</div>')
      .openOn(map);

    let name;
    try {
      const r = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json`,
        { headers: { 'Accept-Language': 'en' } }
      );
      const d = await r.json();
      name = shortName(d.display_name || `${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}`);
    } catch(e) {
      name = `${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}`;
    }

    const iStyle = `width:100%;background:#0d1117;border:1px solid #30363d;border-radius:4px;
      color:#e6edf3;padding:4px 7px;font-size:12px;outline:none;margin-bottom:8px;box-sizing:border-box`;
    const el = document.createElement('div');
    el.style.cssText = 'font-family:system-ui;font-size:12px;min-width:210px';
    el.innerHTML = `
      <div style="font-size:10px;color:#888;margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px">Label</div>
      <input id="_addLocTag" placeholder="e.g. Home, Office…" style="${iStyle};border-color:#58a6ff" />
      <div style="font-size:10px;color:#888;margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px">Address</div>
      <input id="_addLocAddr" value="${name.replace(/"/g,'&quot;')}" style="${iStyle}" />
      <button id="_addLocBtn" style="
        background:#1c2d4a;border:1px solid #58a6ff;color:#58a6ff;
        border-radius:5px;padding:4px 12px;font-size:11px;cursor:pointer;width:100%">
        📍 Add location
      </button>`;
    popup.setContent(el);

    setTimeout(() => {
      const tagInput  = document.getElementById('_addLocTag');
      const addrInput = document.getElementById('_addLocAddr');
      const btn       = document.getElementById('_addLocBtn');
      if (tagInput) { tagInput.focus(); }
      const doAdd = () => {
        const tag  = tagInput  ? tagInput.value.trim()  : '';
        const addr = addrInput ? addrInput.value.trim() : name;
        map.closePopup();
        pushLocation({ tag, name: addr, lat: latlng.lat, lon: latlng.lng });
        syncURL(); saveLocations();
        if (!locOpen) toggleLocations();
      };
      if (btn) btn.addEventListener('click', doAdd);
      [tagInput, addrInput].forEach(inp => {
        if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } });
      });
    }, 30);
  }

  // Desktop: right-click
  map.on('contextmenu', e => { showAddLocPopup(e.latlng); });

  // Mobile + desktop: long press (600ms, cancel if panning starts or finger moves > 10px)
  let _lpTimer = null;
  let _lpStart = null;

  const _mapEl = map.getContainer();

  _mapEl.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    _lpStart = { x: t.clientX, y: t.clientY };
    _lpTimer = setTimeout(() => {
      if (!_lpStart) return;
      const ll = map.containerPointToLatLng(L.point(t.clientX - _mapEl.getBoundingClientRect().left, t.clientY - _mapEl.getBoundingClientRect().top));
      showAddLocPopup(ll);
      _lpStart = null;
    }, 600);
  }, { passive: true });

  _mapEl.addEventListener('touchmove', e => {
    if (!_lpStart) return;
    const t = e.touches[0];
    if (Math.hypot(t.clientX - _lpStart.x, t.clientY - _lpStart.y) > 10) {
      clearTimeout(_lpTimer); _lpStart = null;
    }
  }, { passive: true });

  _mapEl.addEventListener('touchend',   () => { clearTimeout(_lpTimer); _lpStart = null; }, { passive: true });
  _mapEl.addEventListener('touchcancel',() => { clearTimeout(_lpTimer); _lpStart = null; }, { passive: true });
  map.on('movestart', () => { clearTimeout(_lpTimer); _lpStart = null; });

  function loadFromURL() {
    const params = new URL(window.location.href).searchParams;

    // Handle compressed short URL (?s=...)
    if (_parsedShortState?.locs?.length) {
      let loaded = false;
      _parsedShortState.locs.forEach(l => {
        if (!isNaN(l.lat) && !isNaN(l.lon)) { pushLocation({ tag: l.tag||'', name: l.name||'', lat: l.lat, lon: l.lon }); loaded = true; }
      });
      return loaded;
    }
    if (_parsedShortState) return !!(_parsedShortState.lat || _parsedShortState.lon);

    // Handle legacy long URL (?lat=...&lon=...&locs=...)
    const locs = params.get('locs');
    if (!locs) return false;
    let loaded = false;
    locs.split('|').forEach(entry => {
      const parts = entry.split('~');
      if (parts.length >= 3) {
        // format: tag~addr~lat~lon  OR  addr~lat~lon (legacy)
        const hasTag = parts.length >= 4;
        const tag  = hasTag ? decodeURIComponent(parts[0]) : '';
        const name = decodeURIComponent(parts[hasTag ? 1 : 0]);
        const lat  = parseFloat(parts[hasTag ? 2 : 1]);
        const lon  = parseFloat(parts[hasTag ? 3 : 2]);
        if (!isNaN(lat) && !isNaN(lon)) { pushLocation({ tag, name, lat, lon }); loaded = true; }
      }
    });
    return loaded;
  }

  function saveLocations() {
    localStorage.setItem('dsm_locs', JSON.stringify(userLocs.map(l => ({ tag: l.tag||'', name: l.name, lat: l.lat, lon: l.lon }))));
  }

  function loadFromStorage() {
    if (userLocs.length) return;
    try {
      const saved = JSON.parse(localStorage.getItem('dsm_locs') || '[]');
      saved.forEach(loc => pushLocation(loc));
    } catch(e) {}
  }

  // ─── PREFS (filter/tz/slider) persisted in localStorage, not URL ─────
  const PREFS_V = '3'; // bump when schema changes to auto-clear stale prefs

  function savePrefs() {
    localStorage.setItem('dsm_prefs', JSON.stringify({
      v: PREFS_V, filterType, filterShowConfirmed, filterShowSuspected, tzMode, windowHours
    }));
  }

  function loadPrefs() {
    try {
      const p = JSON.parse(localStorage.getItem('dsm_prefs') || '{}');
      // Stale or incompatible prefs → discard entirely
      if (p.v !== PREFS_V) { localStorage.removeItem('dsm_prefs'); return; }

      if (p.filterType) {
        filterType = p.filterType;
        document.querySelectorAll('[data-type]').forEach(b => {
          b.classList.toggle('active', b.dataset.type === filterType);
        });
      }
      // Only restore conf prefs if they won't result in nothing showing
      const sc = p.filterShowConfirmed !== false;
      const ss = p.filterShowSuspected !== false;
      if (sc || ss) { // at least one must be true
        filterShowConfirmed = sc;
        filterShowSuspected = ss;
      }
      document.querySelector('[data-conf="confirmed"]')?.classList.toggle('active', filterShowConfirmed);
      document.querySelector('[data-conf="suspected"]')?.classList.toggle('active', filterShowSuspected);

      if (p.tzMode) tzMode = p.tzMode;
      if (p.windowHours != null) windowHours = p.windowHours;
    } catch(e) { localStorage.removeItem('dsm_prefs'); }
  }

  // ─── SHARE ─────────────────────────────────────────────────────────────
  function openSharePanel() {
    const panel = document.getElementById('share-panel');
    const isOpen = panel.style.display !== 'none';
    panel.style.display = isOpen ? 'none' : 'block';
    document.getElementById('share-copied').style.display = 'none';
  }

  function closeSharePanel() {
    document.getElementById('share-panel').style.display = 'none';
  }

  function doShare(includeLocs, short) {
    syncURL();
    let url;
    if (short) {
      url = buildShortUrl(includeLocs);
    } else {
      url = window.location.href;
      if (!includeLocs) {
        const u = new URL(url);
        u.searchParams.delete('locs');
        url = u.toString();
      }
    }
    navigator.clipboard.writeText(url).then(() => {
      const s = document.getElementById('share-copied');
      s.textContent = `✓ Copied!`;
      s.style.display = 'block';
      setTimeout(() => {
        s.style.display = 'none';
        closeSharePanel();
      }, 2000);
    });
  }

  // ─── LOAD DATA ─────────────────────────────────────────────────────────
  // Data sources: GitHub API (fresh) with CDN fallback (cache-busted)
  const DATA_API = 'https://api.github.com/repos/TimeHunter81/DubaiStrikes/contents/data.json';
  const DATA_CDN = 'https://timehunter81.github.io/DubaiStrikes/data.json';

  async function fetchWithTimeout(url, opts, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const r = await fetch(url, { ...opts, signal: ctrl.signal });
      clearTimeout(timer);
      return r;
    } catch(e) {
      clearTimeout(timer);
      throw e;
    }
  }

  async function loadData(isRefresh) {
    try {
      let r;
      try {
        // Try GitHub API first (always fresh, no CDN cache)
        r = await fetchWithTimeout(DATA_API, {
          headers: { 'Accept': 'application/vnd.github.raw+json', 'X-GitHub-Api-Version': '2022-11-28' },
          cache: 'no-store'
        }, 6000);
        if (!r.ok) throw new Error('HTTP ' + r.status);
      } catch(e) {
        // Fallback: GitHub Pages CDN with cache-buster
        r = await fetchWithTimeout(DATA_CDN + '?t=' + Date.now(), { cache: 'no-store' }, 8000);
        if (!r.ok) throw new Error('HTTP ' + r.status);
      }
      const data = await r.json();
      const newLastUpdated = data.last_updated || '';
      // Skip re-render if data hasn't changed
      if (isRefresh && newLastUpdated && newLastUpdated === window._lastDataUpdated) return;
      window._lastDataUpdated = newLastUpdated;
      window._lastDataUpdatedMs = newLastUpdated ? new Date(newLastUpdated).getTime() : Date.now();
      allEvents = data.events || [];
      const upd = newLastUpdated ? relTimeShort(newLastUpdated) : '—';
      document.getElementById('last-updated').textContent = 'Updated ' + upd;
      updateStatus(allEvents);
      updateConfFilters();
      if (!isRefresh) {
        try { loadPrefs(); } catch(_) {}
        try { updateTZBtn(); } catch(_) {}
        try { initSlider(data.conflict_start || '2026-02-27T20:00:00Z'); } catch(_) {}
        try { const fromURL = loadFromURL(); if (!fromURL) loadFromStorage(); } catch(_) {}
      }
      try {
        renderEvents();
      } catch(renderErr) {
        console.error('Dubai Strike Monitor: renderEvents failed', renderErr);
        // Emergency fallback: render plain list without map interaction
        const list = document.getElementById('events-list');
        if (list) {
          list.innerHTML = allEvents.map(e =>
            `<div class="event-card" style="cursor:default">
              <div class="event-badges"><span class="badge ${(e.type||'')}">${e.type||'alert'}</span></div>
              <div class="event-time"><span class="rel">${relTime(e.datetime)}</span></div>
              <div class="event-title">${e.title}</div>
              <div class="event-meta">${e.location||'UAE'} · ${e.datetime?.slice(0,10)||''}</div>
            </div>`
          ).join('');
        }
      }
      if (!isRefresh) { try { renderLocations(); } catch(_) {} }
      translatePending(allEvents);
    } catch(err) {
      console.error('Dubai Strike Monitor: data load failed', err);
      // Use a persistent error div (empty-state may have been removed by renderEvents)
      const errEl = document.getElementById('empty-state') || document.getElementById('events-list');
      if (errEl && !isRefresh) errEl.innerHTML = `<div style="padding:16px;color:#f85149">Error loading data: ${err && err.message ? err.message : err}</div>`;
    }
  }

  // ─── TRANSLATION ────────────────────────────────────────────────────────
  window._translations = {};   // id → { original, translated, showingOriginal }

  function needsTranslation(title) {
    return /[^\x00-\x7F]/.test(title);
  }

  async function fetchTranslation(text) {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`;
    const r = await fetch(url);
    const data = await r.json();
    return data[0].map(s => s[0]).join('');
  }

  async function translatePending(events) {
    const toTranslate = events.filter(e => needsTranslation(e.title) && !window._translations[e.id]);
    for (const e of toTranslate) {
      try {
        const translated = await fetchTranslation(e.title);
        window._translations[e.id] = { original: e.title, translated, showingOriginal: false };
        const titleEl = document.getElementById('title-' + e.id);
        const btnEl   = document.getElementById('trbtn-' + e.id);
        if (titleEl) titleEl.textContent = translated;
        if (btnEl)   btnEl.textContent = '🌐 Original';
      } catch(_) {}
    }
  }

  function toggleOriginal(evt, id, encodedTitle) {
    evt.stopPropagation();
    const t = window._translations[id];
    if (!t) return;
    const titleEl = document.getElementById('title-' + id);
    const btn     = document.getElementById('trbtn-' + id);
    if (!titleEl || !btn) return;
    t.showingOriginal = !t.showingOriginal;
    titleEl.textContent = t.showingOriginal ? t.original : t.translated;
    btn.textContent = t.showingOriginal ? '🌐 English' : '🌐 Original';
  }

  // Initial load
  loadData(false);
  // Auto-refresh every 2 minutes — only re-renders if last_updated changed
  setInterval(() => loadData(true), 2 * 60 * 1000);

  // Countdown to next cron update (every 10 min from last_updated)
  const CRON_INTERVAL_MS = 10 * 60 * 1000;
  setInterval(() => {
    const el = document.getElementById('next-update');
    if (!el || !window._lastDataUpdatedMs) return;
    const nextMs = window._lastDataUpdatedMs + CRON_INTERVAL_MS;
    const diffMs = nextMs - Date.now();
    if (diffMs <= 0) {
      el.textContent = '· updating…';
    } else {
      const m = Math.floor(diffMs / 60000);
      const s = Math.floor((diffMs % 60000) / 1000);
      el.textContent = `· next update ${m}:${String(s).padStart(2,'0')}`;
    }
  }, 1000);
  </script>
</body>
</html>
